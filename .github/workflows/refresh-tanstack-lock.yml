name: Refresh patched TanStack lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/refresh-tanstack-lock.yml
  push:
    branches:
      - chore/preparacion-publicacion-neurovincle-2026-11-05
    paths:
      - package.json
      - .github/workflows/refresh-tanstack-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.3.5

      - name: Regenerate lockfile safely
        run: bun install --lockfile-only --ignore-scripts

      - name: Ensure patched packages were selected
        run: |
          python3 - <<'PY'
          import re
          import pathlib
          lock = pathlib.Path("bun.lock").read_text()
          checks = {
              "@tanstack/react-start": "1.168.60",
              "@tanstack/start-server-core": "1.169.39",
          }
          for name, minimum in checks.items():
              found = re.search(rf'"{re.escape(name)}": \["{re.escape(name)}@(\d+\.\d+\.\d+)', lock)
              if not found:
                  raise SystemExit(f"{name} not resolved in bun.lock")
              version = found.group(1)
              if tuple(map(int, version.split("."))) < tuple(map(int, minimum.split("."))):
                  raise SystemExit(f"Unsafe {name} version: {version} < {minimum}")
              print(f"Verified {name}@{version}")
          PY

      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh bun.lock with patched TanStack dependencies"
            git push origin HEAD:chore/preparacion-publicacion-neurovincle-2026-11-05
          fi
